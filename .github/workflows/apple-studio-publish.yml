name: Publish captured Apple window for PR review
on:
  push:
    branches: [codex/apple-studio-publish-evidence]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {sparse-checkout: .github}
      - uses: actions/download-artifact@v4
        with:
          name: mac-studio-preview
          repository: tolgraven/tolglow
          run-id: 45145873580
          github-token: ${{ github.token }}
          path: mac-review
      - name: Publish the two captured images on a media-only branch
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/media-index"
          for file in studio.png studio.gif; do
            blob="$(git hash-object -w mac-review/$file)"
            git update-index --add --cacheinfo 100644,"$blob","apple-studio/$file"
          done
          tree="$(git write-tree)"
          commit="$(git -c user.name='Tolglow CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -m 'Record three cue launches in the real bundled macOS Studio')"
          git push origin "$commit:refs/heads/codex/apple-studio-live-cue-media"
