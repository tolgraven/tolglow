name: Touch performance controls in WebKit
on:
  push:
    branches: [codex/studio-webkit-browser-evidence]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: f6097d772dcd59896d3a3624413dad6c53779e05
          path: tolglow
      - uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 9387c0ae211397734a761ac98c4894cbfeeb83e4
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tolglow/package-lock.json
      - name: Install the verified Leiningen release
        working-directory: tolglow
        run: .github/scripts/install-lein
      - name: Restore Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: maven-${{ runner.os }}-${{ hashFiles('tolglow/project.clj', 'afterglow/project.clj') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Install Studio and build the release
        working-directory: tolglow
        run: |
          npm ci
          npm run studio:build
      - name: Exercise the iPhone and iPad WebKit profiles
        working-directory: tolglow
        env:
          JAVA_TOOL_OPTIONS: -Dclojure.main.report=stderr
          STUDIO_TEST_BROWSER: webkit
        run: |
          npx --no-install playwright-core install --with-deps webkit
          lein run -m tolglow.qa.performance-layout target/webkit-perform
      - name: Recheck the default Chromium runner
        if: always() && !cancelled()
        env:
          JAVA_TOOL_OPTIONS: -Dclojure.main.report=stderr
        working-directory: tolglow
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          lein run -m tolglow.qa.performance-layout target/chromium-perform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-perform
          path: |
            tolglow/target/webkit-perform/
            tolglow/target/chromium-perform/
          if-no-files-found: warn
