name: Live weighted venue compact emission comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
          ref: c4d860a7081b12239a9b51c968dea69e87db4b21
      - uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          path: afterglow
          ref: 5a4ff8cf9695c0b61ba0ccd65cb209c854d63f9d
          fetch-depth: 100
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the same physical scheduler and optical implementation in all four shows
        run: |
          set -euo pipefail
          git -C afterglow fetch --no-tags --depth=100 origin 74d0de46ec7dfd4d6985287c01989c9999b2990d
          git -C afterglow -c user.name=Qualification -c user.email=qualification@localhost merge --no-commit --no-ff FETCH_HEAD
          test "$(git -C afterglow write-tree)" = 7a1067f6c6858094d5053577cb11cef5bcf6a04d
          git -C tolglow fetch --no-tags --depth=2 origin 7f19dbf3d11813168c3f610ad35a1748a625ae00
          git -C tolglow diff FETCH_HEAD^ FETCH_HEAD -- src/tolglow/spatial.clj > "$RUNNER_TEMP/compact.patch"
          mkdir -p results
      - name: Install the repository's verified Leiningen release
        working-directory: tolglow
        run: .github/scripts/install-lein
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: performance-maven-${{ runner.os }}-${{ hashFiles('tolglow/project.clj', 'afterglow/project.clj') }}
          restore-keys: performance-maven-${{ runner.os }}-
      - name: Compare complete 40 Hz shows in alternating fresh JVMs
        working-directory: tolglow
        env:
          AFTERGLOW_ROOT: ../afterglow
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/aggregate.clj" <<'CLJ'
          (require '[clojure.edn :as edn])
          (let [[path lane blob out] *command-line-args*
                report (edn/read-string (slurp path))
                summary (:summary report)]
            (assert (= 240 (:nominal-slots summary)))
            (assert (:show-output-exercised? summary) (select-keys summary [:faulted-instances :incomplete-packets :distinct-volume-poses :distinct-delivered-aim-states]))
            (assert (= 0 (:incomplete-packets summary)))
            (let [result (assoc (select-keys report [:rig :summary :window-resources :motion])
                                :variant lane :host-source-blob blob
                                :workload "c4d860a7081b12239a9b51c968dea69e87db4b21"
                                :afterglow-tree "7a1067f6c6858094d5053577cb11cef5bcf6a04d")]
              (spit out (pr-str result))
              (prn lane (select-keys summary [:nominal-slots :completed-renders :complete-within-25-ms
                                             :sent :source-counts :incomplete-packets]) (:window-resources report))))
          CLJ
          deps=$(lein with-profile +benchmark classpath)
          for label in A1 B1 B2 A2; do
            git restore --source=HEAD -- src/tolglow/spatial.clj
            if [[ "$label" == B* ]]; then git apply "$RUNNER_TEMP/compact.patch"; fi
            source_blob=$(git hash-object src/tolglow/spatial.clj)
            lein with-profile +benchmark run -m tolglow.perf.weighted-live "$RUNNER_TEMP/$label.edn" 20000 160 240 > "$RUNNER_TEMP/$label.log"
            java -cp "$deps" clojure.main "$RUNNER_TEMP/aggregate.clj" "$RUNNER_TEMP/$label.edn" "$label" "$source_blob" "../results/$label.edn"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-emission-live-summary
          path: results/*.edn
          if-no-files-found: warn
