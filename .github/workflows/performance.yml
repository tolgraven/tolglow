name: Dedicated live mixed venue experiment
on:
  workflow_dispatch:
    inputs:
      tolglow_ref:
        description: Tolglow source revision to measure
        type: string
        default: master
      afterglow_ref:
        description: Optional Afterglow candidate (defaults to the pinned companion)
        type: string
        default: ''
      compare_afterglow_ref:
        description: Optional baseline Afterglow revision; run baseline then repeat candidate
        type: string
        default: ''
      compare_tolglow_ref:
        description: Optional baseline Tolglow revision; run baseline then repeat candidate
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: show-performance-${{ github.event.pull_request.number || ((inputs.compare_afterglow_ref || inputs.compare_tolglow_ref) && github.run_id) || 'master' }}
  cancel-in-progress: false
jobs:
  profile:
    name: Profile ${{ matrix.companion }}
    strategy:
      fail-fast: false
      matrix:
        companion: ${{ fromJSON(github.event_name == 'schedule' && '["paired", "upstream"]' || '["paired"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Reusable calls originate on the default branch (currently effects).
          # Measure master for those calls, never the caller's older source tree.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.ref == 'refs/heads/master' && github.sha || inputs.tolglow_ref || 'master' }}
          path: tolglow
      - name: Resolve paired Afterglow revision once
        uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: ${{ inputs.afterglow_ref || matrix.companion == 'upstream' && 'master' || '74d0de46ec7dfd4d6985287c01989c9999b2990d' }}
          path: afterglow
      - name: Resolve optional Afterglow baseline once
        if: inputs.compare_afterglow_ref != ''
        uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: ${{ inputs.compare_afterglow_ref }}
          path: afterglow-baseline
      - name: Resolve optional Tolglow baseline once
        if: inputs.compare_tolglow_ref != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.compare_tolglow_ref }}
          path: tolglow-baseline
      - name: Record immutable measured commits
        run: |
          mkdir -p performance-artifact
          git -C tolglow rev-parse HEAD > performance-artifact/tolglow-commit.txt
          git -C afterglow rev-parse HEAD > performance-artifact/afterglow-commit.txt
          if [[ -d afterglow-baseline ]]; then
            git -C afterglow-baseline rev-parse HEAD > performance-artifact/baseline-afterglow-commit.txt
          fi
          if [[ -d tolglow-baseline ]]; then
            git -C tolglow-baseline rev-parse HEAD > performance-artifact/baseline-tolglow-commit.txt
          fi
          date -u +%FT%TZ > performance-artifact/resolved-at.txt
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the verified Leiningen release
        working-directory: tolglow
        run: .github/scripts/install-lein
      - name: Cache Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: performance-maven-${{ runner.os }}-${{ hashFiles('tolglow/project.clj', 'afterglow/project.clj') }}
          restore-keys: performance-maven-${{ runner.os }}-
      - name: Compare baseline and candidate live shows on this runner
        run: |
          set -euo pipefail
          root_dir="$PWD"
          for pass in baseline candidate candidate-repeat baseline-repeat; do
            case "$pass" in
              baseline*) host=tolglow-baseline; fork=afterglow-baseline ;;
              *) host=tolglow; fork=afterglow ;;
            esac
            (cd "$host" && AFTERGLOW_ROOT="$root_dir/$fork" lein with-profile +benchmark run \
                -m tolglow.perf.weighted-live "$root_dir/performance-artifact/$pass.edn" 20000 160 240)
          done
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: master-show-performance-${{ github.run_id }}${{ matrix.companion == 'upstream' && '-upstream' || '' }}
          path: performance-artifact/
          retention-days: 90
