name: Read the embedded iPad launch diagnostics
on:
  push:
    branches: [codex/inspect-ipad-snapshot]
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {repository: tolgraven/tolglow, run-id: 45182869110, name: embedded-host-ios-sim, github-token: '${{ github.token }}', path: product}
      - name: Extract launch diagnostics and UI screenshots
        run: |
          python3 -m pip -q install pillow lzfse zstandard
          mkdir readable
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import collections,gzip,io,lzfse,re,zlib,zstandard
          root = next(Path('product').rglob('run-ui.xcresult')); out = Path('readable')
          kinds=collections.Counter(); errors=[]; images=0
          for path in root.rglob('*'):
              if not path.is_file():continue
              b=path.read_bytes()
              if b[:4] in (b'bvx-',b'bvx1',b'bvx2',b'bvxn'):
                  try: b=lzfse.decompress(b)
                  except ValueError:pass
              if b[:2]==b'\x1f\x8b':
                  try:b=gzip.decompress(b)
                  except OSError:pass
              if b[:4]==b'\x28\xb5\x2f\xfd':
                  try:b=zstandard.ZstdDecompressor().decompress(b,max_output_size=256*1024*1024)
                  except zstandard.ZstdError:pass
              kinds[b[:6].hex()]+=1
              for needle in [b'\x89PNG\r\n\x1a\n',b'\xff\xd8\xff',b'ftypqt  ',b'ftypisom',b'ftypmp42']:
                  at=b.find(needle)
                  if at<0:continue
                  if needle.startswith(b'ftyp'):
                      if len(b)-at<16*1024**2: (out/f'ui-{images}.mp4').write_bytes(b[max(0,at-4):]); images+=1
                  else:
                      try:
                          im=Image.open(io.BytesIO(b[at:])); im.thumbnail((850,850)); im.convert('RGB').save(out/f'ui-{images}.jpg'); images+=1
                      except OSError: pass
              for hit in re.finditer(rb'(?:Exception|Caused by:|open\(\) failed|MissingReflection|MissingResource|Failed to start|Could not start this show|graal_create_isolate|Could not initialize the local runtime)', b):
                  text=re.sub(rb'[^\x20-\x7e\r\n]',' '.encode(),b[max(0,hit.start()-55):hit.end()+190]).decode('ascii')
                  errors.append(text)
          (out/'diagnostics.txt').write_text('\n'.join(dict.fromkeys(errors))[:750000])
          print('file types',kinds.most_common(24),'images',images,'matched diagnostics',len(errors))
          PY
      - uses: actions/upload-artifact@v7.0.2
        with: {name: ipad-launch-diagnostics, path: readable}
