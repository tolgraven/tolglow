name: Evaluate full hosted Studio Native Image
on:
  push:
    branches: [codex/apple-full-native-image-evaluation]
permissions: {contents: read, actions: read}
jobs:
  evaluate:
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: studio-runtime
          repository: tolgraven/tolglow
          run-id: 45142899389
          github-token: ${{ github.token }}
      - uses: graalvm/setup-graalvm@v1.6.10
        with: {java-version: '25', distribution: 'graalvm-community'}
      - name: Build the full application with direct Clojure initialization
        shell: bash
        run: |
          curl -fLsS https://repo.clojars.org/com/github/clj-easy/graal-build-time/1.0.6/graal-build-time-1.0.6.jar -o graal-build-time.jar
          echo '2104dddf7d103f5cc1e34b08d82b1b6217168ee75e9e01d261ddb607866e78bc  graal-build-time.jar' | shasum -a 256 -c -
          curl -fLsS https://repo.maven.apache.org/maven2/io/github/willena/sqlite-jdbc/3.49.0.0/sqlite-jdbc-3.49.0.0.jar -o sqlite.jar
          echo '8240639e54a1270fbc11cd56b5f5f0d0ea4aab839a9b80c791978aef4522e01e  sqlite.jar' | shasum -a 256 -c -
          mkdir -p override/tolglow/agents override/thi/ng/math
          unzip -p studio.jar tolglow/agents/credentials.clj | sed 's/\.toAbsolutePath (if/.toAbsolutePath ^Path (if/' > override/tolglow/agents/credentials.clj
          unzip -p studio.jar tolglow/persistence.clj | sed 's/(def \^:private json-factory (JsonFactory\.))/(def ^:private json-factory (delay (JsonFactory.)))/;s/\^JsonFactory json-factory/\^JsonFactory @json-factory/' > override/tolglow/persistence.clj
          unzip -p studio.jar thi/ng/math/core.cljc | sed 's/:clj (java.util.Random\.)/:clj (when-not (Boolean\/getBoolean "tolglow.native.build") (java.util.Random.))/' > override/thi/ng/math/core.cljc
          java -cp dev:studio.jar clojure.main -m tolglow.native-assets studio.jar override/tolglow/native-assets.edn
          cp src/tolglow/native_resources.clj override/tolglow/native_resources.clj
          cat > override/tolglow/fixed_image.clj <<'CLOJURE'
          (ns tolglow.fixed-image (:gen-class)
            (:require [thi.ng.math.core :as math] [tolglow.native-resources] [tolglow.studio] [tolglow.application :as app]))
          (defn -main [& args]
            (alter-var-root #'math/*rnd* (fn [current] (or current (java.util.Random.))))
            (try (Class/forName "org.eclipse.jetty.ee9.nested.HttpOutput")
                 (catch Throwable failure (.printStackTrace failure) (throw failure)))
            (apply app/-main args))
          CLOJURE
          java -Dclojure.compile.path=override -cp override:studio.jar clojure.main -e "(doseq [ns '[thi.ng.math.core tolglow.agents.credentials tolglow.persistence tolglow.native-resources tolglow.fixed-image]] (compile ns))"
          jar uf studio.jar -C override .
          if find "$JAVA_HOME" -name 'libnative-image-agent.dylib' | grep -q .; then
            mkdir -p tracing/META-INF/native-image/tolglow/studio
            java -agentlib:native-image-agent=config-output-dir="$PWD/tracing/META-INF/native-image/tolglow/studio" -cp studio.jar tolglow.fixed_image --port 0 >training.log 2>&1 &
            trainer=$!
            trap 'kill "$trainer" 2>/dev/null || true' EXIT
            for ((i=0; i<120; i++)); do
              if grep -q 'Tolglow Studio listening on' training.log; then break; fi
              if ! kill -0 "$trainer"; then tail -30 training.log; exit 1; fi
              sleep 1
            done
            origin="$(sed -n 's/Tolglow Studio listening on //p' training.log)"
            curl -fsS "$origin/studio/js/main.js" -o /dev/null
            curl -fsS "$origin/api/state" -o /dev/null
            kill -TERM "$trainer"
            wait "$trainer" || test "$?" = 143
            trap - EXIT
            python3 - <<'METADATA'
          import json
          from pathlib import Path
          directory=Path('tracing/META-INF/native-image/tolglow/studio')
          prefixes=('java.nio.', 'sun.nio.', 'java.io.', 'java.net.', 'java.util.', 'java.time.',
                    'javax.net.', 'org.eclipse.jetty.', 'org.slf4j.', 'com.fasterxml.jackson.')
          def retained(entry):
              name=entry.get('type',entry.get('name',''))
              return isinstance(name,str) and name.startswith(prefixes) and 'condition' not in entry
          for path in directory.iterdir():
              if path.name=='reflect-config.json':
                  entries=json.loads(path.read_text())
                  path.write_text(json.dumps([e for e in entries if retained(e)]))
              elif path.name=='reachability-metadata.json':
                  tables=json.loads(path.read_text())
                  path.write_text(json.dumps({'reflection':[e for e in tables.get('reflection',[]) if retained(e)]}))
              elif path.is_file():
                  path.unlink()
          METADATA
            jar uf studio.jar -C tracing META-INF
          fi
          native-image -H:IncludeResourceBundles=jakarta.servlet.LocalStrings,jakarta.servlet.http.LocalStrings --no-fallback -J-Dtolglow.native.build=true --initialize-at-build-time=com.cognitect.transit.impl,com.fasterxml.jackson.core.JsonToken --features=clj_easy.graal_build_time.InitClojureClasses --enable-url-protocols=http,https,jar -cp sqlite.jar:studio.jar:graal-build-time.jar -H:IncludeResources='studio/.*|gpu/.*|js/compute/.*|tolglow.edn|.*\.edn|.*\.clj[cs]?' -o studio-native tolglow.fixed_image 2>&1 | tee native-build.log
          ./studio-native --port 0 >native-start.log 2>&1 &
          child=$!
          trap 'kill "$child" || true' EXIT
          for ((i=0; i<90; i++)); do
            if grep -q 'Tolglow Studio listening on' native-start.log; then break; fi
            if ! kill -0 "$child"; then cat native-start.log; exit 1; fi
            sleep 1
          done
          origin="$(sed -n 's/Tolglow Studio listening on //p' native-start.log)"
          for endpoint in / /studio/js/main.js /api/state; do
            status="$(curl -sS -o response "$origin$endpoint" -w '%{http_code}')"
            echo "$endpoint HTTP $status, $(wc -c <response) bytes"
            if test "$status" != 200; then head -c 8192 response; cat native-start.log; exit 1; fi
          done
          mv response native-state.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-image-diagnostics
          path: |
            *.log
            reports/
            studio-native
            native-state.json

  ios:
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: studio-runtime
          repository: tolgraven/tolglow
          run-id: 45142899389
          github-token: ${{ github.token }}
      - name: Cross-compile the full Ring application for iOS using GluonFX
        shell: bash
        run: |
          url='https://github.com/gluonhq/graal/releases/download/gluon-22.1.0.1-Final/graalvm-svm-java17-darwin-m1-gluon-22.1.0.1-Final.tar.gz'
          curl -fLsS --retry 3 "$url" -o "$RUNNER_TEMP/gluon.tgz"
          echo "847b549a616f47687625e77a044ed3e162e96850f227f852db57b04528d09024  $RUNNER_TEMP/gluon.tgz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/gluon"
          tar -xf "$RUNNER_TEMP/gluon.tgz" --strip-components 1 -C "$RUNNER_TEMP/gluon"
          export GRAALVM_HOME="$(dirname "$(dirname "$(find "$RUNNER_TEMP/gluon" -type f -name java -path '*/bin/java' | head -1)")")"
          export JAVA_HOME="$GRAALVM_HOME" PATH="$GRAALVM_HOME/bin:$PATH"
          java -version
          curl -fLsS https://repo.clojars.org/com/github/clj-easy/graal-build-time/1.0.6/graal-build-time-1.0.6.jar -o graal-build-time.jar
          echo '2104dddf7d103f5cc1e34b08d82b1b6217168ee75e9e01d261ddb607866e78bc  graal-build-time.jar' | shasum -a 256 -c -
          mkdir -p override/tolglow/agents override/thi/ng/math
          unzip -p studio.jar tolglow/agents/credentials.clj | sed 's/\.toAbsolutePath (if/.toAbsolutePath ^Path (if/' > override/tolglow/agents/credentials.clj
          unzip -p studio.jar tolglow/persistence.clj | sed 's/(def \^:private json-factory (JsonFactory\.))/(def ^:private json-factory (delay (JsonFactory.)))/;s/\^JsonFactory json-factory/\^JsonFactory @json-factory/' > override/tolglow/persistence.clj
          unzip -p studio.jar thi/ng/math/core.cljc | sed 's/:clj (java.util.Random\.)/:clj (when-not (Boolean\/getBoolean "tolglow.native.build") (java.util.Random.))/' > override/thi/ng/math/core.cljc
          java -cp dev:studio.jar clojure.main -m tolglow.native-assets studio.jar override/tolglow/native-assets.edn
          cp src/tolglow/native_resources.clj override/tolglow/native_resources.clj
          cat > override/tolglow/fixed_image.clj <<'CLOJURE'
          (ns tolglow.fixed-image (:gen-class)
            (:require [thi.ng.math.core :as math] [tolglow.native-resources] [tolglow.studio] [tolglow.application :as app]))
          (defn -main [& args]
            (alter-var-root #'math/*rnd* (fn [current] (or current (java.util.Random.))))
            (try (Class/forName "org.eclipse.jetty.ee9.nested.HttpOutput")
                 (catch Throwable failure (.printStackTrace failure) (throw failure)))
            (if (= "runtime" (System/getProperty "org.graalvm.nativeimage.imagecode"))
              (app/-main "--host" "127.0.0.1" "--port" "8500")
              (apply app/-main args)))
          CLOJURE
          java -Dclojure.compile.path=override -cp override:studio.jar clojure.main -e "(doseq [ns '[thi.ng.math.core tolglow.agents.credentials tolglow.persistence tolglow.native-resources tolglow.fixed-image]] (compile ns))"
          jar uf studio.jar -C override .
          if find "$JAVA_HOME" -name 'libnative-image-agent.dylib' | grep -q .; then
            mkdir -p tracing/META-INF/native-image/tolglow/studio
            java -agentlib:native-image-agent=config-output-dir="$PWD/tracing/META-INF/native-image/tolglow/studio" -cp studio.jar tolglow.fixed_image --port 0 >training.log 2>&1 &
            trainer=$!
            trap 'kill "$trainer" 2>/dev/null || true' EXIT
            for ((i=0; i<120; i++)); do
              if grep -q 'Tolglow Studio listening on' training.log; then break; fi
              if ! kill -0 "$trainer"; then tail -30 training.log; exit 1; fi
              sleep 1
            done
            origin="$(sed -n 's/Tolglow Studio listening on //p' training.log)"
            curl -fsS "$origin/studio/js/main.js" -o /dev/null
            curl -fsS "$origin/api/state" -o /dev/null
            kill -TERM "$trainer"
            wait "$trainer" || test "$?" = 143
            trap - EXIT
            python3 - <<'METADATA'
          import json
          from pathlib import Path
          directory=Path('tracing/META-INF/native-image/tolglow/studio')
          prefixes=('org.eclipse.jetty.', 'org.slf4j.', 'com.fasterxml.jackson.')
          def retained(entry):
              name=entry.get('type',entry.get('name',''))
              return isinstance(name,str) and name.startswith(prefixes) and 'condition' not in entry
          for path in directory.iterdir():
              if path.name=='reflect-config.json':
                  entries=json.loads(path.read_text())
                  path.write_text(json.dumps([e for e in entries if retained(e)]))
              elif path.name=='reachability-metadata.json':
                  tables=json.loads(path.read_text())
                  path.write_text(json.dumps({'reflection':[e for e in tables.get('reflection',[]) if retained(e)]}))
              elif path.is_file():
                  path.unlink()
          METADATA
            jar uf studio.jar -C tracing META-INF
          fi
          mvn -q org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile=studio.jar -DgroupId=org.tolglow -DartifactId=studio-host -Dversion=1 -Dpackaging=jar
          mvn -q org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile=graal-build-time.jar -DgroupId=com.github.clj-easy -DartifactId=graal-build-time -Dversion=1.0.6 -Dpackaging=jar
          cat >pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion><groupId>org.tolglow</groupId><artifactId>ios-host</artifactId><version>1</version>
            <dependencies>
              <dependency><groupId>io.github.willena</groupId><artifactId>sqlite-jdbc</artifactId><version>3.49.0.0</version></dependency>
              <dependency><groupId>org.tolglow</groupId><artifactId>studio-host</artifactId><version>1</version></dependency>
              <dependency><groupId>com.github.clj-easy</groupId><artifactId>graal-build-time</artifactId><version>1.0.6</version></dependency>
            </dependencies>
            <build><plugins><plugin><groupId>com.gluonhq</groupId><artifactId>gluonfx-maven-plugin</artifactId><version>1.0.29</version>
            <configuration><target>ios</target><releaseConfiguration><skipSigning>true</skipSigning></releaseConfiguration><mainClass>tolglow.fixed_image</mainClass><nativeImageArgs>
              <nativeImageArg>-H:IncludeResources=studio/.*|gpu/.*|js/compute/.*|tolglow/.*\.edn|tolglow\.edn</nativeImageArg>
              <nativeImageArg>-H:IncludeResourceBundles=jakarta.servlet.LocalStrings,jakarta.servlet.http.LocalStrings</nativeImageArg>
              <nativeImageArg>--features=clj_easy.graal_build_time.InitClojureClasses</nativeImageArg>
              <nativeImageArg>-J-Dtolglow.native.build=true</nativeImageArg>
              <nativeImageArg>--initialize-at-build-time=com.cognitect.transit.impl,com.fasterxml.jackson.core.JsonToken</nativeImageArg>
            </nativeImageArgs></configuration></plugin></plugins></build>
          </project>
          POM
          mkdir -p target/classes
          mvn -B com.gluonhq:gluonfx-maven-plugin:1.0.29:build 2>&1 | tee ios-build.log
          mvn -B com.gluonhq:gluonfx-maven-plugin:1.0.29:package 2>&1 | tee ios-package.log
          result="$(find target/gluonfx -maxdepth 3 -type d -name '*.app' | head -1)"
          test -n "$result"
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$result/Info.plist")"
          file "$result/$executable"
          xcrun vtool -show-build "$result/$executable" | tee ios-platform.log
          grep -q 'platform IOS' ios-platform.log
          ditto -c -k --keepParent "$result" fixed-ios-host.zip
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-native-image-diagnostics
          path: |
            *.log
            target/gluonfx/*/gvm/log/
            fixed-ios-host.zip
