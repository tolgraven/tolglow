name: Diagnose startup of the compiled Studio Native Image
on:
  push:
    branches: [codex/apple-full-native-image-evaluation]
permissions: {contents: read, actions: read}
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-image-diagnostics
          repository: tolgraven/tolglow
          run-id: 45149622090
          github-token: ${{ github.token }}
      - name: Read the application process startup trace
        run: head -60 native-start.log
