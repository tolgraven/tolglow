name: Packaged Apple Studio
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'src/tolglow/desktop.clj'
      - '.github/workflows/apple-studio.yml'
  push:
    branches: [codex/apple-studio-bundle]
permissions:
  contents: read
concurrency:
  group: packaged-studio-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: {path: tolglow}
      - name: Read the paired revision exercised by the architecture suite
        id: fork
        run: |
          pin="$(sed -nE 's/^ +ref: ([a-f0-9]{40})$/\1/p' tolglow/.github/workflows/tests.yml | sort -u)"
          [[ "$pin" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: ${{ steps.fork.outputs.sha }}
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tolglow/package-lock.json
      - name: Install verified Leiningen
        working-directory: tolglow
        run: .github/scripts/install-lein
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('tolglow/project.clj', 'afterglow/project.clj') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build the production re-frame application and Ring host
        working-directory: tolglow
        run: |
          npm ci
          npm run studio:build
          lein uberjar
          mkdir -p ../studio-assets
          cp target/uberjar/*-standalone.jar ../studio-assets/studio.jar
          native/Packaging/archive-sources ../studio-assets "$PWD" "$PWD/../afterglow"
      - uses: actions/upload-artifact@v7.0.2
        with: {name: studio-runtime, path: studio-assets, retention-days: 2}

  mac:
    needs: resources
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with: {name: studio-runtime, path: build}
      - name: Install verified Apple Silicon GraalVM Community build
        run: |
          base=https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.5.5.0.3
          archive=graalvm-community-jdk-25i5-25.0.5.0.3_macos-aarch64_bin.tar.gz
          curl -fLsS --retry 3 "$base/$archive" -o "$RUNNER_TEMP/graal.tar.gz"
          echo "54369d4a5931a5a2101c7c52444a4e7e6647a3a4e041335053cda6fd22295e0c  $RUNNER_TEMP/graal.tar.gz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/graal"
          tar -xf "$RUNNER_TEMP/graal.tar.gz" --strip-components 1 -C "$RUNNER_TEMP/graal"
          echo "JAVA_HOME=$RUNNER_TEMP/graal/Contents/Home" >> "$GITHUB_ENV"
      - name: Build standalone app and run a real show with bundled Java
        run: |
          command -v xcodegen || brew install xcodegen
          native/Packaging/bundle-macos build/studio.jar "$PWD/build/deliverables" build
          native/Tests/check_source_archive "build/deliverables/Tolglow Studio.app/Contents/Resources"
          python3 native/Tests/check_packaged_studio.py "build/deliverables/Tolglow Studio.app"
          ditto -c -k --keepParent "build/deliverables/Tolglow Studio.app" build/Tolglow-Studio-arm64.zip
      - uses: actions/upload-artifact@v7.0.2
        with: {name: Tolglow-Studio-arm64, path: build/Tolglow-Studio-arm64.zip}
      - name: Launch the built app and capture its native window
        run: native/Tests/capture-macos "build/deliverables/Tolglow Studio.app" build/media
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: mac-studio-preview
          path: |
            build/media/studio.png
            build/media/studio.gif
            build/media/launch.log
