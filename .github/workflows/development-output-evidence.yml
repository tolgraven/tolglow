name: Developer output browser evidence
on:
  push:
    branches: [codex/developer-output-browser-evidence]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
      - uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 3fd49ef6877cac57dbc5f0e185fedd2dc7607f39
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tolglow/package-lock.json
      - name: Install the verified Leiningen release
        working-directory: tolglow
        run: .github/scripts/install-lein
      - name: Restore Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: maven-${{ runner.os }}-${{ hashFiles('tolglow/project.clj', 'afterglow/project.clj') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Install Studio and build the release
        working-directory: tolglow
        run: |
          npm ci
          npm run studio:build
      - name: Prepare the isolated shell
        working-directory: tolglow
        run: docker build -t tolglow-dev:local -f dev/container/Dockerfile dev/container
      - name: Exercise both mounted cursors on a paused show
        working-directory: tolglow
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          lein run -m tolglow.qa.developer-output target/developer-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developer-output-browser
          path: tolglow/target/developer-output/
          if-no-files-found: warn
