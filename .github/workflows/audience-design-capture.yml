name: Capture Dance floor on iPhone and iPad
on:
  push:
    branches: [codex/audience-design-simulator-evidence]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Capture the Clip and separate full-app sensor, rendering and recovery controls
        run: bash native/Tests/capture_recovery_design.sh "$RUNNER_TEMP/dance-floor"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dance-floor-recovery-simulators
          path: ${{ runner.temp }}/dance-floor
