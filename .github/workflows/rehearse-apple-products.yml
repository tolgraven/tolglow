name: Exercise the full-window on-device iPad Studio
on:
  push:
    branches: [codex/rehearse-apple-compiled-products]
permissions: {contents: read, actions: read}
jobs:
  ipad:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: fda3a5fb609010bdf6dce4b9abfd25d9d78afeb8}
      - uses: actions/download-artifact@v4
        with: {repository: tolgraven/tolglow, run-id: 45208752583, name: embedded-host-ios-sim, github-token: '${{ github.token }}', path: prior}
      - name: Link this Swift UI against the qualified native iOS simulator library
        run: |
          archive="$(find prior -name embedded-ipad-studio.zip -print -quit)"
          test -s "$archive"
          mkdir -p prior/simulator
          ditto -x -k "$archive" prior/simulator
          library="$(find prior/simulator -name TolglowRuntime -type f -print -quit)"
          test -s "$library"
          native/EmbeddedHost/package-framework "$library" iPhoneSimulator native/build/embedded
          native/Tests/check-embedded-studio
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: full-window-ipad-visuals
          path: |
            build/ipad-media/ipad.png
            build/ipad-media/ipad.gif
            build/ipad-media/studio-chooser.png
            build/ipad-media/attachments/manifest.json
            build/ipad-media/last-start-error.log
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with: {name: full-window-ipad-simulator, path: embedded-ipad-studio.zip}
