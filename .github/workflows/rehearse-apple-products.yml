name: Inspect compiled Apple products
on:
  push:
    branches: [codex/rehearse-apple-compiled-products]
permissions: {contents: read, actions: read}
jobs:
  archived-native-restore:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: {repository: tolgraven/tolglow, run-id: 45173152463, name: Tolglow-compiled-Studio-arm64, github-token: '${{ github.token }}', path: product}
      - name: Restore a synthetic show on the previous standalone Apple Silicon build
        run: |
          archive="$(find product -name Tolglow-compiled-Studio-arm64.zip -print -quit)"
          ditto -x -k "$archive" product/unpacked
          python3 - <<'PY'
          import subprocess, tempfile, time, urllib.request, urllib.error
          from pathlib import Path
          executable = next(Path("product/unpacked").rglob("TolglowNativeHost")).resolve()
          with tempfile.TemporaryDirectory() as raw:
              folder = Path(raw)
              (folder / "tolglow.edn").write_text("{:hz 40 :init {:components [:show] :modules [:web-server]}}")
              ready = folder / "port"
              with subprocess.Popen([str(executable), str(folder), str(ready)], stdin=subprocess.PIPE) as proc:
                  try:
                      t=time.monotonic()
                      while not ready.exists():
                          assert proc.poll() is None and time.monotonic()-t < 70, "Host failed to start"
                          time.sleep(.1)
                      origin="http://127.0.0.1:" + ready.read_text().strip()
                      with urllib.request.urlopen(origin + "/api/export") as response:
                          src=response.read()
                          mime=response.headers.get_content_type()
                          print("Exported synthetic show", len(src), mime, flush=True)
                      for payload, content in [(src, mime), (__import__("json").dumps({"source":src.decode()}).encode(), "application/json")]:
                          req=urllib.request.Request(origin + "/api/import", data=payload, headers={"Content-Type":content})
                          try:
                              with urllib.request.urlopen(req, timeout=20) as result:
                                  print(content, result.status, result.read(3000).decode(), flush=True)
                          except urllib.error.HTTPError as err:
                              print(content, err.status, err.read(3000).decode(), flush=True)
                  finally:
                      proc.stdin.close()
                      proc.wait(timeout=20)
          PY
