name: Architecture regression tests
on:
  push:
    branches: [master, effects]
  pull_request:
concurrency:
  group: architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        suite: [pure, parity]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
      - name: Check out the paired Afterglow implementation
        uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 36abc94562329d8cb6c62c8916629b3e62fe2a21
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
      - name: Cache verified Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: maven-${{ runner.os }}-${{ hashFiles('tolglow/deps.edn', 'tolglow/project.clj', 'afterglow/deps.edn', 'afterglow/project.clj') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Run explicit test lane
        working-directory: tolglow
        run: ./bin/test "${{ matrix.suite }}"
      - name: Validate work tracking
        if: matrix.suite == 'pure'
        working-directory: tolglow
        run: clojure -M:check-roadmap
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
      - uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 36abc94562329d8cb6c62c8916629b3e62fe2a21
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tolglow/package-lock.json
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
      - name: Cache verified Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: maven-${{ runner.os }}-${{ hashFiles('tolglow/deps.edn', 'tolglow/project.clj', 'afterglow/deps.edn', 'afterglow/project.clj') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Install the verified Leiningen release
        shell: bash
        run: |
          lein_dir="$RUNNER_TEMP/tolglow-lein"
          mkdir -p "$lein_dir"
          curl --fail --location --retry 3 \
            https://github.com/technomancy/leiningen/releases/download/2.13.1/leiningen-2.13.1-standalone.jar \
            --output "$lein_dir/lein.jar"
          printf '2e4c36cbaef717d0fa589a1f95e4c526a1cb6c35b48dc92e6dbb30d6f8595b5c  %s\n' "$lein_dir/lein.jar" | sha256sum --check -
          cat > "$lein_dir/lein" <<'LEIN'
          #!/usr/bin/env bash
          exec java -cp "$TOLGLOW_LEIN_JAR" clojure.main -m leiningen.core.main "$@"
          LEIN
          chmod +x "$lein_dir/lein"
          printf 'TOLGLOW_LEIN_JAR=%s\n' "$lein_dir/lein.jar" >> "$GITHUB_ENV"
          printf '%s\n' "$lein_dir" >> "$GITHUB_PATH"
      - name: Install pinned browser dependencies
        working-directory: tolglow
        run: npm ci
      - name: Run actual preview shader and worker regressions
        working-directory: tolglow
        run: |
          npx --no-install playwright-core install --with-deps chromium
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "playwright-core"; process.stdout.write(chromium.executablePath())')"
          npm run preview:test
          bin/profile-mover-shader 64 24
      - name: Run re-frame tests and production build
        working-directory: tolglow
        run: |
          npm run studio:test
          npm run studio:build
      - name: Test and package the complete Leiningen project
        working-directory: tolglow
        run: |
          lein test-parity
          lein uberjar
      - name: Test the Live bridge boundaries
        working-directory: tolglow
        run: node --test src/tolglow/integrations/live_bridge/test/*.test.js src/tolglow/integrations/audio_bridge/*.test.cjs
      - name: Test the browser display bridge
        working-directory: tolglow
        run: node --test src/tolglow/integrations/display_bridge/*.test.js

  native-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Select native build changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git diff --quiet "$BASE_SHA" HEAD -- native .github/workflows/tests.yml; then
            echo 'native=false' >> "$GITHUB_OUTPUT"
          else
            echo 'native=true' >> "$GITHUB_OUTPUT"
          fi
  native:
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect the actual Apple build toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk watchos --show-sdk-version
      - name: Install XcodeGen when unavailable
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Check native manifests and compile unsigned Apple targets
        run: |
          python3 native/Tests/check_contract.py
          python3 native/Tests/check_rig_calibration.py
          native/Tests/check_macos.sh
