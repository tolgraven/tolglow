name: Architecture regression tests
on:
  push:
    branches: [master, effects]
  pull_request:
concurrency:
  group: architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        suite: [pure, parity]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
      - name: Check out the paired Afterglow implementation
        uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 9387c0ae211397734a761ac98c4894cbfeeb83e4
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Install the verified Leiningen release
        working-directory: tolglow
        run: .github/scripts/install-lein
      - name: Cache verified Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: maven-${{ runner.os }}-${{ hashFiles('tolglow/project.clj', 'afterglow/project.clj') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Run explicit test lane
        working-directory: tolglow
        run: |
          if [[ "${{ matrix.suite }}" == pure ]]; then lein test-pure; else lein test; fi
      - name: Exercise Linux GATT and the paired OSC receiver
        if: matrix.java == '21' && matrix.suite == 'pure'
        working-directory: tolglow/linux/audience
        run: lein with-profile +paired test
      - name: Verify public model data and offline preparation
        if: matrix.java == '17' && matrix.suite == 'pure'
        working-directory: tolglow
        run: |
          python3 -m unittest discover -s dev/model-lab
          python3 -m unittest discover -s dev/model-lab/code
      - name: Preserve conversation request IDs from the PR base
        if: github.event_name == 'pull_request' && matrix.suite == 'pure' && matrix.java == '17'
        working-directory: tolglow
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          if git cat-file -e "$BASE_COMMIT:docs/request-coverage.md"; then
            git show "$BASE_COMMIT:docs/request-coverage.md" > "$RUNNER_TEMP/previous-requests.md"
            echo "TOLGLOW_PREVIOUS_REQUESTS=$RUNNER_TEMP/previous-requests.md" >> "$GITHUB_ENV"
          fi
      - name: Validate work tracking
        if: matrix.suite == 'pure'
        working-directory: tolglow
        run: lein check-roadmap
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
      - uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 9387c0ae211397734a761ac98c4894cbfeeb83e4
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tolglow/package-lock.json
      - name: Install the verified Leiningen release
        working-directory: tolglow
        run: .github/scripts/install-lein
      - name: Cache verified Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*.lastUpdated
          key: maven-${{ runner.os }}-${{ hashFiles('tolglow/project.clj', 'afterglow/project.clj') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Install pinned browser dependencies
        working-directory: tolglow
        run: npm ci
      - name: Run actual preview shader and worker regressions
        working-directory: tolglow
        run: |
          npx --no-install playwright-core install --with-deps chromium
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "playwright-core"; process.stdout.write(chromium.executablePath())')"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          npm run preview:test
          node --test test/js/compute/*.test.mjs
          bin/profile-mover-shader 64 24
      - name: Exercise show-configured native shader execution and frame deadlines
        working-directory: tolglow
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a lein with-profile +native-gpu test tolglow.native-show-test
      - name: Run re-frame tests and production build
        working-directory: tolglow
        run: |
          npm run studio:test
          npm run studio:build
      - name: Compare two browser GPU peers with CPU output across two Art-Net universes
        working-directory: tolglow
        timeout-minutes: 5
        run: |
          export TOLGLOW_COMPUTE_TOKEN="$(openssl rand -hex 32)"
          lein run -m tolglow.qa.distributed-render "$RUNNER_TEMP/worker-output" "$CHROMIUM_PATH" 5 170
      - name: Verify energy autopilot and HDR in tablet and phone Studio
        working-directory: tolglow
        timeout-minutes: 5
        run: lein run -m tolglow.qa.autopilot-browser
      - name: Test and package the complete Leiningen project
        working-directory: tolglow
        run: |
          lein test-parity
          lein uberjar
      - name: Test the Live bridge boundaries
        working-directory: tolglow
        run: node --test test/js/ableton-live/*.test.js
      - name: Test the browser display bridge
        working-directory: tolglow
        run: node --test test/js/push-display/*.test.cjs

  development-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
      - uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 9387c0ae211397734a761ac98c4894cbfeeb83e4
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Install the verified Leiningen release
        working-directory: tolglow
        run: .github/scripts/install-lein
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('tolglow/project.clj', 'afterglow/project.clj') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build the actual development image
        working-directory: tolglow
        run: docker build -t tolglow-dev:ci -f dev/container/Dockerfile dev/container
      - name: Exercise owned worktrees, PTY and Lein inside containers
        working-directory: tolglow
        env:
          TOLGLOW_DEV_TEST_IMAGE: tolglow-dev:ci
        run: lein test :docker

  native-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Test native change selection against Git history
        run: .github/scripts/test-native-build-required
      - name: Select native build changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        shell: bash
        run: |
          native=$(.github/scripts/native-build-required "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")
          echo "native=$native" >> "$GITHUB_OUTPUT"
      - name: Exercise audience sensors, camera analysis and gesture timing
        if: steps.paths.outputs.native == 'true'
        env:
          TOLGLOW_POSE_TRACE: ${{ runner.temp }}/audience-pose.csv
          TOLGLOW_AUDIENCE_TIMING_DIR: ${{ runner.temp }}/onset-timing
          TOLGLOW_AUDIENCE_GATT_DIR: ${{ runner.temp }}/gatt
          TOLGLOW_STAGE_TRACE: ${{ runner.temp }}/stage-heartbeat.json
        run: |
          mkdir -p "$TOLGLOW_AUDIENCE_TIMING_DIR" "$TOLGLOW_AUDIENCE_GATT_DIR"
          swift test --package-path native/Core
      - uses: actions/upload-artifact@v4
        if: steps.paths.outputs.native == 'true'
        with:
          name: audience-camera-pose-trace
          path: ${{ runner.temp }}/audience-pose.csv
          if-no-files-found: error
          retention-days: 10
      - uses: actions/upload-artifact@v4
        if: steps.paths.outputs.native == 'true'
        with:
          name: audience-onset-timing
          path: ${{ runner.temp }}/onset-timing/*.json
          if-no-files-found: error
          retention-days: 10
      - uses: actions/upload-artifact@v4
        if: steps.paths.outputs.native == 'true'
        with:
          name: audience-gatt-qualification
          path: ${{ runner.temp }}/gatt/gatt-traces.json
          if-no-files-found: error
          retention-days: 10
      - uses: actions/upload-artifact@v4
        if: steps.paths.outputs.native == 'true'
        with:
          name: audience-stage-heartbeat
          path: ${{ runner.temp }}/stage-heartbeat.json
          if-no-files-found: error
          retention-days: 10
  native:
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect the actual Apple build toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk watchos --show-sdk-version
      - name: Install XcodeGen when unavailable
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Check native manifests and compile unsigned Apple targets
        run: |
          python3 native/Tests/check_contract.py
          python3 native/Tests/check_rig_calibration.py
          native/Tests/check_macos.sh
      - name: Capture audience App Clip on iPhone simulator
        run: native/Tests/capture_audience.sh "$RUNNER_TEMP/audience-clip"
      - uses: actions/upload-artifact@v4
        with:
          name: audience-clip-simulator
          path: ${{ runner.temp }}/audience-clip
      - name: Capture solo Watch stage enrollment
        run: native/Tests/capture_watch_audience.sh "$RUNNER_TEMP/watch-audience"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-audience
          path: |
            ${{ runner.temp }}/watch-audience/*.png
            ${{ runner.temp }}/watch-audience/*.mp4
            ${{ runner.temp }}/watch-audience/ui.xcresult
          retention-days: 10
