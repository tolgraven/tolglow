name: Architecture regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
        suite: [pure, parity]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
      - name: Check out the paired Afterglow implementation
        uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 1dcce88fa071c4c9c3c5a999f293ff8e18f6c34e
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
      - name: Run explicit test lane
        working-directory: tolglow
        run: ./bin/test "${{ matrix.suite }}"
      - name: Validate work tracking
        if: matrix.suite == 'pure'
        working-directory: tolglow
        run: clojure -M:check-roadmap
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tolglow
      - uses: actions/checkout@v7.0.1
        with:
          repository: tolgraven/afterglow
          ref: 1dcce88fa071c4c9c3c5a999f293ff8e18f6c34e
          path: afterglow
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tolglow/package-lock.json
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
      - name: Install the verified Leiningen release
        shell: bash
        run: |
          lein_dir="$RUNNER_TEMP/tolglow-lein"
          mkdir -p "$lein_dir"
          curl --fail --location --retry 3 \
            https://github.com/technomancy/leiningen/releases/download/2.13.1/leiningen-2.13.1-standalone.jar \
            --output "$lein_dir/lein.jar"
          printf '2e4c36cbaef717d0fa589a1f95e4c526a1cb6c35b48dc92e6dbb30d6f8595b5c  %s\n' "$lein_dir/lein.jar" | sha256sum --check -
          cat > "$lein_dir/lein" <<'LEIN'
          #!/usr/bin/env bash
          exec java -cp "$TOLGLOW_LEIN_JAR" clojure.main -m leiningen.core.main "$@"
          LEIN
          chmod +x "$lein_dir/lein"
          printf 'TOLGLOW_LEIN_JAR=%s\n' "$lein_dir/lein.jar" >> "$GITHUB_ENV"
          printf '%s\n' "$lein_dir" >> "$GITHUB_PATH"
      - name: Install pinned browser dependencies
        working-directory: tolglow
        run: npm ci
      - name: Run re-frame tests and production build
        working-directory: tolglow
        run: |
          npm run studio:test
          npm run studio:build
      - name: Test and package the complete Leiningen project
        working-directory: tolglow
        run: |
          lein test-parity
          lein uberjar
      - name: Test the Live bridge boundaries
        working-directory: tolglow
        run: node --test src/tolglow/integrations/live_bridge/test/*.test.js
      - name: Test the browser display bridge
        working-directory: tolglow
        run: node --test src/tolglow/integrations/display_bridge/*.test.js
